[project]
name = "job-vaccum-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "python-jobspy",
    "pyyaml>=6.0.3,<7",
    "requests>=2.31.0",
]

[project.scripts]
job-vaccum-service = "job_vaccum.__main__:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
job_vaccum = ["storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
python-jobspy = { git = "https://github.com/speedyapply/JobSpy.git", rev = "1988484ac76ff9ae57784750346842e967e8ba10" }

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
